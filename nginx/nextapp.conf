# Deployed to /etc/nginx/conf.d/nextapp.conf on the frontend server.
#
# This is the ONLY nginx config for this app. Two things depend on it:
#
#   1. /backend-api/  — the browser bundle is built against this path
#      (NEXT_PUBLIC_API_URL=/backend-api). Keeping the API same-origin is what
#      allows POST/PUT/PATCH/DELETE and the current-user lookup to work: an
#      absolute http:// URL would be blocked by the browser as mixed content on
#      an HTTPS page. Renaming this location requires rebuilding the frontend.
#
#   2. /             — the Next.js process started with `npm run start`.
#
# The Next.js process itself does NOT pass through here. It calls the backend
# server directly using API_URL from .env.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name fp28.inss.local;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name fp28.inss.local;

    ssl_certificate     /etc/nginx/ssl/fp28.inss.local/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/fp28.inss.local/aw.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Employee registration posts a face image as multipart/form-data. The 1M
    # default rejects it with 413 before the request reaches the backend.
    client_max_body_size 100M;

    # Backend API on the other server.
    location /backend-api/ {
        # The trailing slash strips the /backend-api prefix:
        #   /backend-api/users/me  ->  /users/me
        proxy_pass http://fp28-back.inss.local:7000/;
        proxy_http_version 1.1;

        proxy_set_header Host fp28-back.inss.local;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # https, not $scheme: the backend must build links for the public URL,
        # not for the plain-HTTP hop it actually receives.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        # Reports and device syncs outrun the 60s default.
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Rewrite any redirect the backend issues back onto the public path.
        proxy_redirect http://fp28-back.inss.local:7000/ /backend-api/;
    }

    # Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Next.js HMR / websockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
