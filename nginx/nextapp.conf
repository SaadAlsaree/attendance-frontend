# Deployed at /etc/nginx/conf.d/nextapp.conf on fp28.
#
# The browser now calls the API same-origin at https://fp28.inss.local/backend-api/…
# (see NEXT_PUBLIC_API_URL in .env), so this proxy is on the hot path — it is what
# makes POST/PUT/PATCH/DELETE work over HTTPS. The Next.js node process does NOT go
# through here; it calls the API host directly over HTTP.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name fp28.inss.local;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name fp28.inss.local;

    ssl_certificate     /etc/nginx/ssl/fp28.inss.local/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/fp28.inss.local/aw.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Employee registration posts a face image as multipart/form-data; the 1M
    # default would reject it with 413 before the request reached the API.
    client_max_body_size 100M;

    location /backend-api/ {
        proxy_pass http://fp28-back.inss.local:7000/;
        proxy_http_version 1.1;

        proxy_set_header Host fp28-back.inss.local;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        # Report queries and device syncs outrun the 60s default.
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        proxy_redirect http://fp28-back.inss.local:7000/ /backend-api/;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
